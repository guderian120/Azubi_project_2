version: '3.8'

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase-test
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: passwor
      MB_DB_HOST: postgres
    depends_on:
      - postgres
    networks:
      - metabase-net

  postgres:
    image: postgres:13
    container_name: postgres-test
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: password
    networks:
      - metabase-net

networks:
  metabase-net:
    driver: bridge
